[project]
name = "multivoice-summary-suit"
version = "0.1.0"
description = "Turn multilingual speech into clean transcripts, knowledge reports and briefs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Ahee52" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
asr = ["qwen-asr>=0.0.6"]
whisper = ["faster-whisper>=1.0"]
download = ["yt-dlp>=2025.1.1"]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
mvs = "multivoice.cli:main"
mvs-tray = "multivoice.ui.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multivoice"]
