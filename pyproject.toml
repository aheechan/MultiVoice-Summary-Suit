[project]
name = "multivoice-summary-suit"
version = "0.1.0"
description = "Turn multilingual speech into clean transcripts, knowledge reports and briefs."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = ["qwen-asr>=0.0.6"]
whisper = ["faster-whisper>=1.0"]
download = ["yt-dlp>=2025.1.1"]
dev = ["pytest>=8"]

[project.scripts]
mvs = "multivoice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multivoice"]
