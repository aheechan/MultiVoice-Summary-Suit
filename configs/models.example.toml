# 技术选型由使用者决定，本文件只是样例。
# 引擎可选: qwen3 | whisper | external

[asr]
engine = "qwen3"
# 相对 models.root 或绝对路径
model = "asr/qwen3-asr"
device = "cuda"
language = "auto"

[vad]
enabled = true
# 16 GB 显存下 30 秒是安全上限；再长只会增加峰值显存和延迟
max_seconds = 30
min_silence = 0.45
noise_db = -32

[align]
enabled = false
model = "asr/qwen3-forced-aligner"

[separate]
enabled = false
model = "audio/demucs-htdemucs-ft"

[llm]
temperature = 0.2
# 推理型模型（如 Qwen3.5）必须关闭思考，否则正文为空
thinking = false
# 按顺序尝试，前一个失败自动回落
order = ["local"]

[[llm.providers]]
name = "local"
base_url = "http://127.0.0.1:8082/v1"
model = "Qwen3.5-9B"
api_key = "EMPTY"
timeout_s = 180

[[llm.providers]]
name = "lan"
base_url = "http://192.168.1.10:8000/v1"
model = "your-lan-model"
api_key = "EMPTY"
timeout_s = 180
enabled = false

[[llm.providers]]
name = "cloud"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
timeout_s = 120
enabled = false

[verify]
# 用维基百科核对人名、地名、事件、数字
enabled = true
wiki_lang = ["zh", "en"]
max_terms = 8

[research]
# 遇到词库没有或已过期的词，现场联网核实（每次任务有上限）
enabled = true
max_terms = 6
